[package]
name = "zellij-spawn-silent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Zellij plugin that spawns a command pane without stealing focus"

[lib]
crate-type = ["cdylib"]

[dependencies]
zellij-tile = "0.44.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
